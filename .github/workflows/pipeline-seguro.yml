name: Pipeline seguro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  testes:
    name: Testes e lint
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Executar Ruff
        run: ruff check .

      - name: Executar testes
        run: pytest --cov=app --cov-report=term

  gitleaks:
    name: Verificar segredos no historico
    runs-on: ubuntu-latest
    steps:
      - name: Baixar historico completo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Procurar segredos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud:
    name: Analise SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo e historico
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Analisar e aguardar Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  imagem-segura:
    name: Construir e verificar imagem
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Construir imagem Docker
        run: docker build -t ufla-devops-shop:ci .

      - name: Bloquear vulnerabilidades corrigiveis HIGH e CRITICAL
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: ufla-devops-shop:ci
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

      - name: Gerar e publicar SBOM com Syft
        if: always()
        uses: anchore/sbom-action@v0
        with:
          image: ufla-devops-shop:ci
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-spdx
          upload-artifact: true
          upload-artifact-retention: 30
